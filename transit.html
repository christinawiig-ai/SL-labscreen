<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Avganger · Startuplab</title>
  <style>
    @font-face{font-family:'Replica LL';src:url('assets/fonts/ReplicaLLWeb-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Replica LL';src:url('assets/fonts/ReplicaLLWeb-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#1D2526;color:#FAF8F7;font-family:'Replica LL',sans-serif}
    body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    noscript{position:absolute;inset:20%;font-size:2rem}a{color:inherit}
  </style>
</head>
<body>
  <canvas id="departures" width="1920" height="1080" role="img" aria-label="Kollektivavganger fra Forskningsparken og Gaustad. Se tekstalternativet for tider."></canvas>
  <main class="sr" id="accessible"><h1>Avganger</h1><p>Henter oppdaterte avganger fra Entur.</p></main>
  <noscript>Aktiver JavaScript for å se avganger. <a href="https://entur.no/nearby-stop-place-detail?id=NSR:StopPlace:59600">Sjekk reisen i Entur.</a></noscript>
  <script type="module">
    import {fetchTransit,osloStamp} from './js/pilot/transit.mjs?v=20260909-transit3';
    import {renderTransit} from './js/pilot/transit-render.mjs?v=20260909-transit3';
    const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),accessible=document.querySelector('#accessible');
    const archived=new URLSearchParams(location.search).get('snapshot')==='1';
    let data=null,requestInFlight=false,painting=false,lastAccessible='';
    await Promise.all([document.fonts.load('400 32px "Replica LL"'),document.fonts.load('700 32px "Replica LL"')]);
    async function paint(){
      if(painting)return;painting=true;
      try{
        const view=await renderTransit(ctx,{transitData:data,transitLive:!archived});
        const lines=[view.archived?'Arkivert snapshot. Dette er ikke dagens avganger.':view.valid?'Oppdaterte avganger fra Entur.':'Avganger utilgjengelig. Sjekk Entur før du går.',
          data?.fetchedAt?`Hentet ${osloStamp(data.fetchedAt)}.`:'',
          ...view.sections.flatMap(s=>[`${s.label} fra ${s.name}.`,...s.departures.map(d=>`${d.line} ${d.destination}: ${d.timeLabel}${d.cancelled?'':d.realtime&&!view.archived?', sanntid':', rutetid'}.`)])];
        const text=lines.join(' ');if(text!==lastAccessible){accessible.textContent=text;lastAccessible=text;}
      }finally{painting=false;}
    }
    async function refresh(){
      if(requestInFlight)return;requestInFlight=true;
      try{data=await fetchTransit();}catch(error){console.warn('Entur refresh failed:',error.message);}
      finally{requestInFlight=false;await paint();}
    }
    if(archived){
      try{const response=await fetch('assets/data/transit-snapshot.json?v=20260909-transit3');if(response.ok)data=await response.json();}catch{}
      await paint();
    }else{
      await paint();void refresh();setInterval(refresh,60_000);
      // A failed request never stops the freshness clock or leaves expired times visible.
      setInterval(paint,1_000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){void paint();void refresh();}});
    }
  </script>
</body>
</html>
